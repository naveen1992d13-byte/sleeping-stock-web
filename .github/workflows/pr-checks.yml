name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-syntax:
    name: Backend Python syntax and imports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Compile backend modules
        run: python -m compileall -q backend
      - name: Import overlay/merge modules
        run: |
          cd backend
          python -c "import testing_overlay, testing_github, testing_cleanup, testing_verify, testing_runtime, history_archive"

  backend-focused-tests:
    name: Backend focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - name: Run PR overlay/merge/archive unit tests
        working-directory: backend
        run: |
          python -m pytest -q --tb=short \
            tests/test_testing_overlay.py \
            tests/test_testing_github_merge.py \
            tests/test_testing_cleanup.py \
            tests/test_testing_runtime.py \
            tests/test_hybrid_storage.py::test_prune_deletes_misflagged_historical_rows_after_s3_reverify \
            tests/test_hybrid_storage.py::test_never_prune_today_even_if_enabled \
            tests/test_hybrid_storage.py::test_archive_prune_enabled_default_false \
            tests/test_ses_notifications.py::test_email_test_mode_defaults_true_in_testing \
            tests/test_ses_notifications.py::test_email_test_mode_defaults_false_in_production \
            tests/test_mobile_request_ownership.py::test_testing_env_blocks_live_expo_push

  frontend-build:
    name: Frontend install and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Clean npm ci
        working-directory: frontend
        run: npm ci
      - name: Production build
        working-directory: frontend
        env:
          GENERATE_SOURCEMAP: "false"
          CI: "true"
        run: npm run build
      - name: Frontend tests if present
        working-directory: frontend
        run: |
          if ls src/**/*.test.js src/**/*.test.jsx src/**/*.test.ts 2>/dev/null | grep -q .; then
            npm test -- --watchAll=false --passWithNoTests
          else
            echo "No frontend unit tests found; skipping"
          fi
