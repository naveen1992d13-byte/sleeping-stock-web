name: Testing Phase 5 Browser QA
on:
  workflow_dispatch:
    inputs:
      mode:
        description: build-artifact | stage-a-browser
        required: true
        default: build-artifact
        type: choice
        options:
          - build-artifact
          - stage-a-browser
jobs:
  build-artifact:
    if: ${{ github.event.inputs.mode == 'build-artifact' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build Testing frontend
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: https://testing.sleepingstock.in
          REACT_APP_APP_ENV: testing
          REACT_APP_TESTING_PR: ""
          REACT_APP_TESTING_BRANCH: ${{ github.ref_name }}
          REACT_APP_TESTING_COMMIT: ${{ github.sha }}
          GENERATE_SOURCEMAP: "false"
          CI: "false"
          NODE_OPTIONS: --max-old-space-size=2048
        run: |
          SHORT="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          IST="$(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M:%S IST')"
          UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          export REACT_APP_TESTING_COMMIT="$SHORT"
          export REACT_APP_TESTING_DEPLOYED_AT="$IST"
          npm ci --ignore-scripts || npm install --ignore-scripts
          npm run build
          python3 - <<PY
          import json, os
          from pathlib import Path
          sha = os.environ["GITHUB_SHA"]
          short = sha[:7]
          Path("build/deployment.json").write_text(json.dumps({
            "environment": "testing",
            "app_env": "testing",
            "pr_number": None,
            "git_branch": os.environ.get("GITHUB_REF_NAME") or "testing-six-fixes",
            "commit": sha,
            "commit_short": short,
            "deployed_at": os.environ.get("UTC") or "",
            "deployed_at_ist": os.environ.get("IST") or "",
            "backend_port": 8001,
            "service": "nmts-backend-testing",
            "built_on": "github-actions",
          }, indent=2) + "\n")
          PY
          # inject times into python via env
          UTC="$UTC" IST="$IST" GITHUB_SHA="$GITHUB_SHA" GITHUB_REF_NAME="${GITHUB_REF_NAME}" python3 - <<'PY'
          import json, os
          from pathlib import Path
          sha = os.environ["GITHUB_SHA"]
          Path("build/deployment.json").write_text(json.dumps({
            "environment": "testing",
            "app_env": "testing",
            "pr_number": None,
            "git_branch": os.environ.get("GITHUB_REF_NAME") or "testing-six-fixes",
            "commit": sha,
            "commit_short": sha[:7],
            "deployed_at": os.environ["UTC"],
            "deployed_at_ist": os.environ["IST"],
            "backend_port": 8001,
            "service": "nmts-backend-testing",
            "built_on": "github-actions",
          }, indent=2) + "\n")
          PY
          cp -f ../deploy/testing/robots.txt build/robots.txt
          echo "Built short=$SHORT"
          cat build/deployment.json
      - uses: actions/upload-artifact@v4
        with:
          name: testing-frontend
          path: frontend/build/
          retention-days: 2

  stage-a-browser:
    if: ${{ github.event.inputs.mode == 'stage-a-browser' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci --ignore-scripts || npm install --ignore-scripts
          npm install --no-save @playwright/test@1.48.2
          npx playwright install --with-deps chromium
      - name: Stage A remote UI checks
        working-directory: frontend
        env:
          NMTS_E2E_BASE_URL: https://testing.sleepingstock.in
          NMTS_E2E_EMAIL: ${{ secrets.TESTING_MASTER_EMAIL }}
          NMTS_E2E_PASSWORD: ${{ secrets.TESTING_MASTER_PASSWORD }}
        run: npx playwright test e2e/testing-stage-a.spec.js --project=chromium
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-screenshots
          path: |
            frontend/test-results/
            frontend/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 5
