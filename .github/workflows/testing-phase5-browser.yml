# Phase 5 — remote browser QA against testing.sleepingstock.in
# Runs on GitHub-hosted runners (not the EC2 host). Requires repository secrets:
#   TESTING_MASTER_EMAIL
#   TESTING_MASTER_PASSWORD
name: Testing Phase 5 Browser QA

on:
  workflow_dispatch:
  push:
    branches: [cursor/website-phase2-testing]
    paths:
      - "frontend/**"
      - "backend/analytics_*.py"
      - ".github/workflows/testing-phase5-browser.yml"
      - "frontend/e2e/**"

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps + Playwright
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm install --no-save @playwright/test@1.48.2
          npx playwright install --with-deps chromium

      - name: Run remote Testing QA
        working-directory: frontend
        env:
          NMTS_E2E_BASE_URL: https://testing.sleepingstock.in
          NMTS_E2E_EMAIL: ${{ secrets.TESTING_MASTER_EMAIL }}
          NMTS_E2E_PASSWORD: ${{ secrets.TESTING_MASTER_PASSWORD }}
        run: npx playwright test e2e/testing-phase5.spec.js --project=chromium
