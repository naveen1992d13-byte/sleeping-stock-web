# NMTS nginx: FastAPI on api.sleepingstock.in + SPA on the default HTTP vhost.
# Install: sudo cp deploy/nginx-nmts.conf /etc/nginx/conf.d/nmts-fastapi.conf && sudo nginx -t && sudo nginx -s reload
# TLS for api.sleepingstock.in is managed by Certbot on the host (not duplicated here).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name api.sleepingstock.in;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.sleepingstock.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sleepingstock.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.sleepingstock.in;
    return 301 https://$host$request_uri;
}

# sleepingstock.in has no DNS A record yet; this vhost also answers the
# EC2 public IP so the SPA is reachable without a Codespaces preview URL.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name sleepingstock.in www.sleepingstock.in _;

    root /var/www/nmts-web;
    index index.html;

    # Serve crawler files as themselves. Without these exact locations,
    # a missing file would fall through try_files to index.html (HTML 200).
    location = /robots.txt {
        try_files /robots.txt =404;
        add_header Content-Type text/plain;
        access_log off;
    }
    location = /sitemap.xml {
        try_files /sitemap.xml =404;
        add_header Content-Type application/xml;
        access_log off;
    }
    location = /favicon.ico {
        try_files /favicon.ico =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
