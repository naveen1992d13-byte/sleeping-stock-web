# Isolated testing vhost. Do not merge into nmts-fastapi.conf (production).
# TLS is added by: sudo certbot --nginx -d testing.sleepingstock.in
#
# Cache policy (critical for consistent UI after deploys):
# - index.html / SPA shell: never cache (always pick up new hashed bundles)
# - /static/* hashed assets: long-cache immutable
# - missing /static/* must 404 (never SPA-fallback HTML as JS/CSS)
#
# NOTE: nginx does not inherit add_header into locations that define their own,
# so diagnostic headers are included inside each location via nmts-testing-headers.inc.

server {
    listen 80;
    listen [::]:80;
    server_name testing.sleepingstock.in;

    client_max_body_size 100M;
    root /var/www/testing-frontend;

    location = /robots.txt {
        add_header Content-Type text/plain;
        add_header Cache-Control "no-store";
        include /etc/nginx/nmts-testing-headers.inc;
    }

    location /api {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        include /etc/nginx/nmts-testing-headers.inc;
    }

    location /socket.io {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed CRA assets — cache hard; never fall back to index.html.
    location ^~ /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/nmts-testing-headers.inc;
        access_log off;
    }

    # HTML entry must always revalidate so clients never keep an old bundle map.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        include /etc/nginx/nmts-testing-headers.inc;
        etag off;
        if_modified_since off;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        include /etc/nginx/nmts-testing-headers.inc;
    }
}
